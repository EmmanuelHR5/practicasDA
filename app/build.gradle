plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id("com.google.gms.google-services")
}

android {
    namespace 'com.example.firebasenotes'
    compileSdk 35 // Recomendado subir a 34 si es posible, si no, déjalo en 33

    defaultConfig {
        applicationId "com.example.firebasenotes"
        minSdk 24
        targetSdk 35 // Debe coincidir o ser menor que compileSdk
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.10"
    }


    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    // --- FIREBASE ---
    // Usando BoM para manejar versiones automáticamente
    // Versión estable compatible con Kotlin 1.9
    implementation(platform("com.google.firebase:firebase-bom:33.1.0"))

    // No se especifican versiones aquí gracias al BoM
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-auth") // KTX ya está incluido aquí
    implementation("com.google.firebase:firebase-firestore") // KTX ya está incluido aquí

    // Google Sign In (Necesario para autenticación con Google)
    implementation("com.google.android.gms:play-services-auth:21.0.0")

    // --- ANDROID & COMPOSE ---
    implementation 'androidx.core:core-ktx:1.12.0' // Actualizado
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0' // Actualizado
    implementation 'androidx.activity:activity-compose:1.8.2' // Actualizado

    // Navigation Compose
    implementation("androidx.navigation:navigation-compose:2.7.7")

    // Compose BoM (Actualizado a una versión más reciente y estable)
    implementation platform('androidx.compose:compose-bom:2024.02.00')

    // Librerías Compose (Sin versiones, las maneja el BoM)
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation "androidx.compose.material3:material3:1.2.1"
    implementation "androidx.compose.material:material-icons-extended"


    // --- OTROS ---
    // Lottie
    implementation "com.airbnb.android:lottie-compose:6.3.0" // Versión actualizada
    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    implementation 'androidx.compose.foundation:foundation:1.9.5'

    // --- TESTING ---
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.02.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}